# Git Submodules Plugin Configuration
# Default configuration file
# Copy to ~/.config/git-submodules/config to customize

# Parallel execution
parallel_enabled=false
parallel_jobs=4

# UI preferences
menu_style=numbered           # Options: numbered, arrow, keyboard, both
progress_style=bar            # Options: bar, spinner, dots, none
emoji_enabled=true

# Safety
atomic_commits=false          # All-or-nothing commits across repos
dry_run_default=false         # Show preview by default
confirm_destructive=true      # Confirm before destructive operations

# Performance
cache_enabled=true
cache_ttl=60                  # Cache TTL in seconds

# Verbosity
verbose_mode=true
quiet_mode=false

# Stash behavior
auto_stash=false              # Automatically stash before operations
stash_include_untracked=false # Include untracked files in stash
